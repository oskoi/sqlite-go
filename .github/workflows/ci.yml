name: native
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            cc: gcc-14
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            cc: gcc-14
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            cc: clang
          - runner: macos-15
            os: darwin
            arch: arm64
            cc: clang
          - runner: windows-2025
            os: windows
            arch: amd64
            cc: gcc
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      GO_VERSION: '1.27.3'
      GOTOOLCHAIN: local
      CC: ${{ matrix.cc }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      # Hosted images update; pin Go and record the native toolchain in each run.
      - name: Check build environment
        env:
          EXPECT_OS: ${{ matrix.os }}
          EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          echo "Runner image: $ImageVersion"
          go version
          "$CC" --version
          go env GOOS GOARCH
          test "$(go env GOVERSION)" = "go$GO_VERSION" || { echo "::error::Expected Go $GO_VERSION"; exit 1; }
          test "$(go env GOOS)" = "$EXPECT_OS" || { echo "::error::Expected GOOS=$EXPECT_OS"; exit 1; }
          test "$(go env GOARCH)" = "$EXPECT_ARCH" || { echo "::error::Expected GOARCH=$EXPECT_ARCH"; exit 1; }
          if [ "$EXPECT_OS" = windows ]; then
            target="$("$CC" -dumpmachine)"
            case "$target" in
              *w64-mingw32) ;;
              *) echo "::error::Expected MinGW-w64 compiler, got $target"; exit 1 ;;
            esac
          elif [ "$EXPECT_OS" = linux ]; then
            ldd --version
          fi
      - name: Test native behavior
        run: go test ./... -count=1
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Retained pointer, callback, streaming, backup and blob lifetime checks
        env:
          GOEXPERIMENT: cgocheck2
        run: go test ./... -run 'Test(ParametersAndRetainedInputs|ColumnValuesAndReprepare|NativeAllocationFailures|Callback|Interrupt|BusyTimeout|BusyHandler|Session|Changeset|Stream|Backup|Blob)' -count=1
      - name: Native public-interface smoke
        run: go run ./internal/cmd/smoke
      - name: Multiwriter native behavior, race detector and vet
        env:
          GOFLAGS: -tags=sqlite_multiwriter
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...
      - name: Multiwriter strict cgo checks
        env:
          GOFLAGS: -tags=sqlite_multiwriter
          GOEXPERIMENT: cgocheck2
        run: go test ./... -count=1
      - name: Multiwriter-tagged public-interface smoke and initialization failure
        env:
          GOFLAGS: -tags=sqlite_multiwriter
        run: |
          go run ./internal/cmd/smoke
          go run ./internal/cmd/faultprobe init
      - name: Multiwriter cold-open allocation recovery
        if: ${{ matrix.os != 'windows' }}
        env:
          GOFLAGS: -tags=sqlite_multiwriter
        run: go run ./internal/cmd/faultprobe multiwriter-open
      - name: Warm allocation probes
        run: go test -run '^$' -bench 'Benchmark(TypedNumeric|PreparedExec|ColumnAccess|ParameterLookup|Callbacks|Stream|Backup|Blob)' -benchmem -benchtime=100ms -count=1
